<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Word Wizard Adventure - Học Viện Phù Thủy Cambridge Stage 2</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --app-font-scale: 1;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    body {
      font-family: 'Quicksand', -apple-system, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background-color: #0b0f19;
      background-image: 
        radial-gradient(circle at center, rgba(11, 15, 25, 0.15) 0%, rgba(3, 7, 18, 0.45) 100%),
        url('background_home.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      transition: background-image 0.5s ease-in-out;
    }
    .font-magic {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    
    /* KHUNG TRONG SUỐT VỚI VIỀN XANH NGỌC SÁNG */
    .magic-glass-card {
      background: rgba(15, 23, 42, 0.32);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2.5px solid rgba(56, 189, 248, 0.85);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45), inset 0 0 25px rgba(56, 189, 248, 0.25);
    }

    @keyframes chestWiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-8deg) scale(1.06); }
      40% { transform: rotate(8deg) scale(1.08); }
      60% { transform: rotate(-5deg) scale(1.06); }
      80% { transform: rotate(5deg) scale(1.03); }
    }
    .chest-animate {
      animation: chestWiggle 1.3s infinite ease-in-out;
      transform-origin: bottom center;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .float-anim {
      animation: floatSlow 2.5s infinite ease-in-out;
    }

    /* HIỆU ỨNG CHUYỂN CẢNH MA THUẬT CHO ẢNH 3 BƯỚC (SPRITE SHEET) */
    .magic-stage-viewport {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 9999px;
      overflow: hidden;
      background: #ffffff;
      border: 4px solid #fbbf24;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.7), inset 0 0 20px rgba(168, 85, 247, 0.4);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    /* Chế độ xem toàn cảnh cả 3 bước phóng to */
    .magic-stage-viewport.full-strip-mode {
      width: 100%;
      max-width: 440px;
      height: 175px;
      border-radius: 1.25rem;
    }

    .magic-sprite-strip {
      width: 300%;
      max-width: none !important;
      height: 100%;
      object-fit: cover;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
    }
    .magic-stage-viewport.full-strip-mode .magic-sprite-strip {
      width: 100%;
      object-fit: contain;
      transform: translateX(0%) !important;
    }

    /* Vị trí cắt từng khung hình (Trái - Giữa - Phải) */
    .stage-pos-0 { transform: translateX(0%); }
    .stage-pos-1 { transform: translateX(-33.3333%); }
    .stage-pos-2 { transform: translateX(-66.6667%); }

    /* Hiệu ứng chớp sáng và khói nổ khi chuyển bước */
    @keyframes poofFlash {
      0% { opacity: 1; transform: scale(0.6); }
      50% { opacity: 0.95; transform: scale(1.25); }
      100% { opacity: 0; transform: scale(1.7); }
    }
    .poof-smoke-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, #ffffff 20%, #fde047 60%, rgba(168, 85, 247, 0) 80%);
      pointer-events: none;
      opacity: 0;
      z-index: 20;
    }
    .poof-smoke-overlay.active {
      animation: poofFlash 0.6s ease-out forwards;
    }

    @keyframes cauldronBrewShake {
      0%, 100% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
      25% { transform: rotate(-10deg) scale(1.12); filter: hue-rotate(45deg) brightness(1.2); }
