<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Word Wizard Adventure - Cambridge Stage 2</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/canvas-confetti.browser.min.js"></script>

  <style>
    :root {
      --app-font-scale: 1;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    body {
      font-family: 'Quicksand', -apple-system, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background-color: #0b0f19;
      background-image: 
        radial-gradient(circle at center, rgba(11, 15, 25, 0.15) 0%, rgba(3, 7, 18, 0.45) 100%),
        url('background_home.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      transition: background-image 0.5s ease-in-out;
    }
    .font-magic {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    
    .magic-glass-card {
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2.5px solid rgba(56, 189, 248, 0.85);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45), inset 0 0 25px rgba(56, 189, 248, 0.25);
    }

    @keyframes chestWiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-8deg) scale(1.06); }
      40% { transform: rotate(8deg) scale(1.08); }
      60% { transform: rotate(-5deg) scale(1.06); }
      80% { transform: rotate(5deg) scale(1.03); }
    }
    .chest-animate {
      animation: chestWiggle 1.3s infinite ease-in-out;
      transform-origin: bottom center;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .float-anim {
      animation: floatSlow 2.5s infinite ease-in-out;
    }

    .magic-viewport-box {
      position: relative;
      width: 220px;
      height: 220px;
      min-height: 220px;
      border-radius: 1.5rem;
      overflow: hidden;
      background-color: #ffffff;
      border: 4px solid #fbbf24;
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.7);
      flex-shrink: 0;
      transition: all 0.35s ease;
    }
    .magic-viewport-box.full-view-mode {
      width: 100%;
      max-width: 440px;
      height: 165px;
      min-height: 165px;
    }

    .sprite-strip-3x {
      position: absolute;
      top: 0;
      left: 0%;
      width: 300% !important;
      max-width: none !important;
      height: 100% !important;
      object-fit: cover;
      transition: left 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.35s ease;
    }
    .magic-viewport-box.full-view-mode .sprite-strip-3x {
      width: 100% !important;
      left: 0% !important;
      object-fit: contain;
    }

    @keyframes flashBurst {
      0% { opacity: 1; transform: scale(0.7); }
      40% { opacity: 0.95; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1.8); }
    }
    .poof-flash-ring {
      background: radial-gradient(circle, #ffffff 30%, #fde047 65%, rgba(168, 85, 247, 0) 90%);
    }
    .poof-flash-ring.active {
      animation: flashBurst 0.55s ease-out forwards;
    }

    /* Hiệu ứng thông báo rơi nguyên liệu */
    @keyframes lootPopupAnim {
      0% { transform: translateY(20px) scale(0.8); opacity: 0; }
      20% { transform: translateY(0px) scale(1.05); opacity: 1; }
      80% { transform: translateY(0px) scale(1); opacity: 1; }
      100% { transform: translateY(-25px) scale(0.9); opacity: 0; }
    }
    .loot-popup {
      animation: lootPopupAnim 2s ease-in-out forwards;
    }
    
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
  </style>
</head>
<body class="flex flex-col text-slate-100 antialiased h-screen w-screen overflow-hidden" id="appBody">

  <!-- TOP APP BAR -->
  <header class="flex-none px-3 py-2 bg-slate-950/70 backdrop-blur-md border-b border-cyan-500/30 z-30">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div class="relative w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-sm shadow-md flex-shrink-0">
          🧙‍♂️
          <span id="playerBadge" class="absolute -bottom-1 -right-1 text-[9px] bg-cyan-400 text-slate-950 px-1 rounded-full font-black">Lv.1</span>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1">
            <h1 class="text-xs sm:text-sm font-bold text-cyan-200 font-magic tracking-wide truncate">Minh The Wizard</h1>
            <span id="playerRankTitle" class="hidden md:inline-block text-[10px] bg-purple-950/90 text-purple-200 px-1.5 py-0.2 rounded border border-purple-500/40 font-semibold truncate">Novice</span>
          </div>
          <div class="flex items-center gap-1.5 text-[10px] text-slate-200">
            <div class="w-16 sm:w-24 bg-slate-800/80 h-1.5 rounded-full overflow-hidden">
              <div id="topProgressBar" class="bg-gradient-to-r from-cyan-400 to-purple-400 h-full w-0 transition-all duration-300"></div>
            </div>
            <span id="qCounterMini" class="font-mono">1/100</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3 bg-slate-900/85 px-2.5 py-1 rounded-full border border-slate-700 text-xs shadow-inner">
        <div class="flex items-center gap-1 text-cyan-300 font-bold" title="Magic Gems">
          <span>💎</span>
          <span id="starCounter">0</span>
        </div>
        <div class="w-px h-3 bg-slate-700"></div>
        <div class="flex items-center gap-1 text-amber-300 font-bold" title="Streak">
          <span>🔥</span>
          <span id="streakCounter">0</span>
        </div>
        <div class="w-px h-3 bg-slate-700"></div>
        <div class="flex items-center gap-1 text-purple-300 font-bold" title="Vault Pets">
          <span>🐾</span>
          <span id="petCountDisplay">0/9</span>
        </div>
      </div>

      <div class="flex items-center gap-1 sm:gap-1.5">
        <button onclick="togglePotionLab()" class="px-2.5 py-1 bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-600 hover:to-indigo-600 text-amber-200 rounded-lg text-xs font-bold border border-purple-400/50 flex items-center gap-1 transition shadow">
          <span>🧪</span>
          <span class="hidden sm:inline font-magic">Potion Lab</span>
        </button>
        <button onclick="toggleRealmMap()" class="px-2 py-1 bg-indigo-950/80 hover:bg-indigo-900 text-indigo-200 rounded-lg text-xs font-semibold border border-indigo-500/40 flex items-center gap-1 transition">
          <span>🗺️</span>
          <span class="hidden sm:inline">Realms</span>
        </button>
        <button onclick="toggleInventoryModal()" class="p-1.5 bg-slate-900/90 hover:bg-slate-800 text-cyan-300 rounded-lg border border-slate-700 text-xs transition" title="Pet Vault">
          🎒
        </button>
        <button onclick="toggleMute()" id="muteBtn" class="p-1.5 bg-slate-900/90 hover:bg-slate-800 text-slate-200 rounded-lg border border-slate-700 text-xs transition" title="Mute Audio">
          🔊
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main class="flex-1 flex flex-col items-center justify-center p-2 sm:p-4 min-h-0 relative z-10 w-full overflow-hidden">
    <div class="w-full max-w-3xl flex-1 flex flex-col justify-between max-h-[calc(100dvh-4.5rem)]">
      
      <div id="magicMirrorCard" class="relative flex-1 flex flex-col magic-glass-card rounded-2xl p-3 sm:p-5 transition-all duration-300 overflow-hidden w-full">
        
        <!-- Header -->
        <div class="flex-none flex items-center justify-between border-b border-cyan-500/30 pb-2.5 mb-3">
          <div class="flex items-center gap-2.5 min-w-0">
            <span id="realmIcon" class="text-2xl">✨</span>
            <div class="truncate">
              <span id="realmTag" class="text-sm sm:text-base font-black uppercase tracking-wider text-amber-300 font-magic block truncate drop-shadow">PART 1: SPELLING REALM (Q1)</span>
              <span id="realmDesc" class="text-xs text-cyan-100 block truncate font-semibold">Listen closely and spell the magic rune</span>
            </div>
          </div>
          <button id="btnHeaderSpeak" onclick="speakCurrentTarget()" class="flex-shrink-0 w-10 h-10 bg-purple-900/90 hover:bg-purple-800 text-purple-200 rounded-xl text-lg font-bold border border-purple-400/50 flex items-center justify-center transition shadow-md active:scale-95" title="Listen UK Voice">
            🔊
          </button>
        </div>

        <!-- VÙNG NỘI DUNG CÂU HỎI -->
        <div id="questionContainer" class="flex-1 flex flex-col items-center justify-center text-center min-h-0 overflow-y-auto px-1 py-1 w-full"></div>

        <!-- VÙNG TƯƠNG TÁC -->
        <div id="interactiveArea" class="flex-none pt-2.5 mt-auto border-t border-cyan-500/30 flex flex-col items-center gap-2 w-full"></div>

      </div>

    </div>
  </main>

  <!-- THÔNG BÁO RƠI NGUYÊN LIỆU KHI LÀM ĐÚNG -->
  <div id="lootPopupContainer" class="fixed top-20 right-5 z-50 flex flex-col items-end pointer-events-none space-y-2"></div>

  <!-- MODAL: PHÒNG THÍ NGHIỆM PHA CHẾ THUỐC (POTION LAB) -->
  <div id="potionLabModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-lg z-50 hidden flex items-center justify-center p-2 sm:p-4">
    <div class="relative bg-gradient-to-b from-slate-900/95 via-indigo-950/95 to-slate-950/95 backdrop-blur-xl border-2 border-amber-400/80 rounded-3xl p-4 sm:p-5 max-w-lg w-full text-center shadow-2xl flex flex-col items-center max-h-[96vh] overflow-y-auto">
      
      <div class="flex items-center justify-between w-full pb-2 border-b border-amber-500/30 mb-2">
        <h3 class="text-sm sm:text-base font-bold text-amber-300 font-magic flex items-center gap-1.5">
          <span>🧪</span> Wizard Potion Lab & Magic Show
        </h3>
        <div class="flex items-center gap-2">
          <button onclick="toggleRecipeBook()" class="px-2.5 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg text-xs font-black font-magic flex items-center gap-1 shadow transition">
            <span>📖</span> Recipe Book
          </button>
          <button onclick="togglePotionLab()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
        </div>
      </div>

      <!-- Khu vực Vạc Thuốc -->
      <div id="cauldronArea" class="my-1 flex flex-col items-center">
        <div id="cauldronVisualWrap" class="relative w-32 h-32 sm:w-36 sm:h-36 flex items-center justify-center float-anim">
          <div id="cauldronGlow" class="absolute inset-0 bg-purple-500/30 rounded-full blur-xl transition-all duration-300"></div>
          <img id="cauldronImgEl" src="potion_cauldron.png" alt="Magic Cauldron" class="relative z-10 max-h-full max-w-full object-contain drop-shadow-2xl" onerror="tryAlternativePath(this, 'potion_cauldron.png', '🧪')">
        </div>
        <p id="cauldronStatusText" class="text-xs text-cyan-200 font-semibold mt-1">Pick 3 magical ingredients from your loot to brew!</p>
      </div>

      <!-- KHU VỰC SÂN KHẤU BIẾN HÌNH 3 BƯỚC -->
      <div id="transformationResultArea" class="hidden flex-col items-center my-1.5 bg-gradient-to-b from-purple-950/85 to-slate-900/95 border-2 border-amber-400/80 rounded-2xl p-3 w-full shadow-2xl relative">
        
        <div class="flex items-center justify-between w-full px-1 mb-2 gap-1 flex-wrap">
          <span id="stageStep
