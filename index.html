<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Word Wizard Adventure - Học Viện Phù Thủy Cambridge Stage 2</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --app-font-scale: 1;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden; /* Chống cuộn toàn trang */
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background-color: #0b0f19;
      background-image: 
        radial-gradient(circle at center, rgba(11, 15, 25, 0.4) 0%, rgba(3, 7, 18, 0.75) 100%),
        url('background_home.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .font-magic {
      font-family: 'Comic Neue', cursive, sans-serif;
    }
    
    /* Hiệu ứng gương thần phát sáng */
    .magic-glow {
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.45), inset 0 0 15px rgba(245, 158, 11, 0.2);
    }
    .magic-glow-pulse {
      animation: magicPulse 2s infinite alternate;
    }
    @keyframes magicPulse {
      0% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), inset 0 0 10px rgba(168, 85, 247, 0.2); }
      100% { box-shadow: 0 0 35px rgba(234, 179, 8, 0.7), inset 0 0 20px rgba(234, 179, 8, 0.4); }
    }
    
    /* Tùy chỉnh thanh cuộn nếu màn hình cực nhỏ */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  </style>
</head>
<body class="flex flex-col text-slate-100 antialiased h-screen overflow-hidden">

  <!-- TOP APP BAR / HEADER (Cố định, nhỏ gọn) -->
  <header class="flex-none px-3 py-2 bg-slate-950/80 backdrop-blur-md border-b border-amber-500/20 z-30">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <!-- Player Profile -->
      <div class="flex items-center gap-2 min-w-0">
        <div class="relative w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-purple-600 flex items-center justify-center text-sm shadow-md flex-shrink-0">
          🧙‍♂️
          <span class="absolute -bottom-1 -right-1 text-[9px] bg-amber-500 text-slate-950 px-1 rounded-full font-black">Lv.1</span>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1">
            <h1 class="text-xs sm:text-sm font-bold text-amber-300 truncate">Minh The Wizard</h1>
          </div>
          <!-- Mini Progress -->
          <div class="flex items-center gap-1.5 text-[10px] text-slate-400">
            <div class="w-16 sm:w-24 bg-slate-800 h-1.5 rounded-full overflow-hidden">
              <div id="topProgressBar" class="bg-gradient-to-r from-amber-400 to-purple-500 h-full w-0 transition-all duration-300"></div>
            </div>
            <span id="qCounterMini" class="font-mono">1/100</span>
          </div>
        </div>
      </div>

      <!-- Stats: Gems, Streak, Lives -->
      <div class="flex items-center gap-2 sm:gap-4 bg-slate-900/90 px-2.5 py-1 rounded-full border border-slate-800 text-xs shadow-inner">
        <div class="flex items-center gap-1 text-cyan-400 font-semibold" title="Stars Earned">
          <span>💎</span>
          <span id="starCounter">0</span>
        </div>
        <div class="w-px h-3 bg-slate-700"></div>
        <div class="flex items-center gap-1 text-amber-400 font-semibold" title="Streak">
          <span>🔥</span>
          <span id="streakCounter">0</span>
        </div>
        <div class="w-px h-3 bg-slate-700"></div>
        <div class="flex items-center gap-1 text-rose-400 font-semibold" title="Shield Hearts">
          <span>💖</span>
          <span>3/3</span>
        </div>
      </div>

      <!-- Control Actions -->
      <div class="flex items-center gap-1 sm:gap-1.5">
        <button onclick="toggleRealmMap()" class="px-2 py-1 bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 rounded-lg text-xs font-semibold border border-indigo-500/30 flex items-center gap-1 transition">
          <span>🗺️</span>
          <span class="hidden sm:inline">Realms</span>
        </button>
        <button onclick="toggleInventoryModal()" class="p-1.5 bg-slate-900 hover:bg-slate-800 text-amber-300 rounded-lg border border-slate-700 text-xs transition" title="Treasure Vault">
          🎒
        </button>
        <button onclick="adjustFontScale(0.1)" class="p-1.5 bg-slate-900 hover:bg-slate-800 text-slate-200 rounded-lg border border-slate-700 text-xs font-bold transition" title="Increase Font">
          A+
        </button>
        <button onclick="toggleMute()" id="muteBtn" class="p-1.5 bg-slate-900 hover:bg-slate-800 text-slate-200 rounded-lg border border-slate-700 text-xs transition" title="Mute Audio">
          🔊
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN GAMEPLAY VIEWPORT (Co giãn trọn vẹn trong 1 màn hình) -->
  <main class="flex-1 flex flex-col items-center justify-center p-2 sm:p-4 min-h-0 relative z-10">
    <div class="w-full max-w-3xl flex-1 flex flex-col justify-between max-h-[calc(100dvh-4.5rem)]">
      
      <!-- MAGIC MIRROR CARD -->
      <div id="magicMirrorCard" class="relative flex-1 flex flex-col bg-slate-900/90 backdrop-blur-xl border-2 border-amber-500/40 rounded-2xl p-3 sm:p-5 shadow-2xl magic-glow transition-all duration-300 overflow-hidden">
        
        <!-- Header thông tin Realm / Part -->
        <div class="flex-none flex items-center justify-between border-b border-slate-800/80 pb-2 mb-2">
          <div class="flex items-center gap-2 min-w-0">
            <span id="realmIcon" class="text-lg">✨</span>
            <div class="truncate">
              <span id="realmTag" class="text-[11px] font-black uppercase tracking-wider text-amber-400 block truncate">PART 1: SPELLING REALM</span>
              <span id="realmDesc" class="text-[10px] text-slate-400 block truncate">Listen closely and spell the magic rune</span>
            </div>
          </div>
          <button id="btnHeaderSpeak" onclick="speakCurrentTarget()" class="flex-shrink-0 px-2 py-1 bg-purple-950/80 hover:bg-purple-900 text-purple-300 rounded-lg text-xs font-semibold border border-purple-500/30 flex items-center gap-1 transition">
            <span>📢</span>
            <span class="hidden sm:inline">Listen Prompt</span>
          </button>
        </div>

        <!-- VÙNG NỘI DUNG CÂU HỎI (Tự động co giãn theo tỷ lệ màn hình) -->
        <div id="questionContainer" class="flex-1 flex flex-col items-center justify-center text-center min-h-0 overflow-y-auto px-1 py-1">
          <!-- Nội dung render động qua JavaScript -->
        </div>

        <!-- VÙNG TƯƠNG TÁC: INPUT / LỰA CHỌN TRẮC NGHIỆM -->
        <div id="interactiveArea" class="flex-none pt-2 mt-auto border-t border-slate-800/60 flex flex-col items-center gap-2">
          <!-- Dynamic Controls -->
        </div>

      </div>

    </div>
  </main>

  <!-- MODAL: BẢN ĐỒ REALMS (Ẩn mặc định) -->
  <div id="realmMapModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
    <div class="bg-slate-900 border-2 border-amber-500/50 rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-950/50">
        <h3 class="text-sm font-bold text-amber-400 flex items-center gap-1.5">
          <span>🗺️</span> 9 Magic Realms of Cambridge Stage 2

      </div>

      </div>
    </div>
  </div>

      </div>
      <div id="artifactsGrid" class="grid grid-cols-3 gap-2.5 py-2">

      </div>

    // --- 2. GAME STATE & LOCALSTORAGE ---
    let currentQIndex = 0;

    function loadProgress() {
      try {
        const savedIndex = localStorage.getItem("word_wizard_q_index");
        const savedStars = localStorage.getItem("word_wizard_stars");
        const savedStreak = localStorage.getItem("word_wizard_streak");
        if (savedIndex !== null) currentQIndex = parseInt(savedIndex, 10) || 0;
        if (savedStars !== null) starsEarned = parseInt(savedStars, 10) || 0;
        if (savedStreak !== null) streakCount = parseInt(savedStreak, 10) || 0;
      } catch (e) {
        console.warn("Storage access restricted", e);
      }
      updateTopBarUI();
    }

    function saveProgress() {
      try {
        localStorage.setItem("word_wizard_q_index", currentQIndex);
        localStorage.setItem("word_wizard_stars", starsEarned);
        localStorage.setItem("word_wizard_streak", streakCount);
      } catch (e) {}
      updateTopBarUI();
    }

      document.getElementById("streakCounter").innerText = streakCount;

    // --- 3. DUAL-ENGINE AUDIO (STUDIO UK SPEECH) ---
    function speakText(text, pitch = 1.0, rate = 0.88) {
      if (isMuted || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-GB';
      u.rate = rate;
      u.pitch = pitch;
      const voices = window.speechSynthesis.getVoices();
      const ukVoice = voices.find(v => v.lang.includes('en-GB') || v.name.includes('UK') || v.name.includes('British'));
      if (ukVoice) u.voice = ukVoice;
      window.speechSynthesis.speak(u);
    }

    function playSound(type) {
      if (isMuted) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1046.50, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(130, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById("muteBtn").innerText = isMuted ? "🔇" : "🔊";
      if (isMuted && window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function adjustFontScale(delta) {
      fontScale = Math.min(1.4, Math.max(0.85, fontScale + delta));
      document.documentElement.style.setProperty('--app-font-scale', fontScale);
    }

    // --- 4. RENDER CÂU HỎI VÀ TỐI ƯU CHIỀU CAO KHUNG NHÌN ---
    function getCurrentRealm(qId) {
      return REALMS.find(r => qId >= r.range[0] && qId <= r.range[1]) || REALMS[0];

    // Xử lý fallback ảnh bằng vector SVG sạch sẽ
    function handleImageError(imgEl, id) {
      imgEl.onerror = null;
      imgEl.parentElement.innerHTML = `
        <div class="w-full h-36 flex flex-col items-center justify-center bg-slate-950 text-slate-400 p-2 text-center">
          <span class="text-3xl mb-1">🖼️</span>
          <span class="text-xs font-semibold text-amber-300">Scene #${id} Illustration</span>
          <span class="text-[10px] text-slate-500">Describe what you imagine in this scene</span>
        </div>
      `;
    }

    // --- 5. LOGIC KIỂM TRA ĐÁP ÁN & HIỆU ỨNG CHIẾN THẮNG ---
    function handleSuccess(rewardStars = 1) {
      playSound('correct');
      starsEarned += rewardStars;
      streakCount++;
      saveProgress();

      // Confetti pháo hoa
      if (typeof confetti === 'function') {
        confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } });
      }

      // Flash card viền vàng
      const card = document.getElementById("magicMirrorCard");
      card.classList.add("ring-4", "ring-emerald-400");

      setTimeout(() => {
        card.classList.remove("ring-4", "ring-emerald-400");
        nextQuestion();
      }, 900);
    }

    function handleFailure(correctAnswerText) {
      playSound('wrong');
      streakCount = 0;
      saveProgress();
      const card = document.getElementById("magicMirrorCard");
      card.classList.add("ring-4", "ring-rose-500");
      
      speakText("Try again, wizard! The answer is " + correctAnswerText);
      setTimeout(() => {
        card.classList.remove("ring-4", "ring-rose-500");
      }, 1000);
    }

    function checkSpelling() {
      const q = QUESTIONS[currentQIndex];
      const val = (document.getElementById("spellingInput")?.value || "").trim().toLowerCase();
      if (val === q.target.toLowerCase()) {
        handleSuccess(2);
      } else {
        handleFailure(q.target);
      }
    }

    function checkMissingLetter() {
      const q = QUESTIONS[currentQIndex];
      const val = (document.getElementById("missingInput")?.value || "").trim().toLowerCase();
      if (val === q.answer.toLowerCase()) {
        handleSuccess(1);
      } else {
        handleFailure(q.answer);
      }
    }

    function checkPlural() {
      const q = QUESTIONS[currentQIndex];
      const val = (document.getElementById("pluralInput")?.value || "").trim().toLowerCase();
      if (val === q.answer.toLowerCase()) {
        handleSuccess(1);
      } else {
        handleFailure(q.answer);
      }
    }

    function checkMultipleChoice(selected) {
      const q = QUESTIONS[currentQIndex];
      if (selected === q.answer) {
        handleSuccess(1);
      } else {
        handleFailure(q.answer);
      }
    }

    function selectJumbleWord(word, idx) {
      const btn = document.getElementById(`jumbleBtn_${idx}`);
      if (btn) btn.classList.add("hidden");
      selectedJumbleWords.push({ word, idx });

      const ansBox = document.getElementById("jumbleAnswerBox");
      ansBox.innerHTML = selectedJumbleWords.map(item => `
        <span class="px-2 py-0.5 bg-purple-900/80 border border-purple-500/40 rounded text-amber-200 text-xs font-bold">
          ${item.word}
        </span>
      `).join('');
    }

    function resetJumble() {
      selectedJumbleWords.forEach(item => {
        const btn = document.getElementById(`jumbleBtn_${item.idx}`);
        if (btn) btn.classList.remove("hidden");
      });
      selectedJumbleWords = [];
      document.getElementById("jumbleAnswerBox").innerHTML = `<span class="text-xs text-slate-500 font-normal">Tap words below...</span>`;
    }

    function checkJumble() {
      const q = QUESTIONS[currentQIndex];
      const sentence = selectedJumbleWords.map(i => i.word).join(' ');
      if (sentence === q.answer) {
        handleSuccess(2);
      } else {
        handleFailure(q.answer);
      }
    }

    function checkCaption() {
      const q = QUESTIONS[currentQIndex];
      const val = (document.getElementById("captionInput")?.value || "").trim();
      
      // Kiểm tra chuẩn ngữ pháp Cambridge Stage 2:
      // 1. Bắt đầu bằng chữ hoa
      // 2. Kết thúc bằng dấu chấm (.)
      // 3. Có ít nhất 3 từ
      const hasCapital = /^[A-Z]/.test(val);
      const hasPeriod = /[.!?]$/.test(val);
      const words = val.split(/\s+/).filter(Boolean);

      if (words.length >= 3 && hasCapital && hasPeriod) {
        handleSuccess(3);
      } else {
        let msg = "Remember: Start with a CAPITAL letter and finish with a period (.)!";
        if (words.length < 3) msg = "Please write a complete sentence with at least 3 words!";
        alert(msg);
        speakText(msg);
      }
    }

    function nextQuestion() {
      if (currentQIndex < QUESTIONS.length - 1) {
        currentQIndex++;
        saveProgress();
        renderCurrentQuestion();
      } else {
        // Hoàn thành cả 100 câu!
        alert("🎉 CONGRATULATIONS! Minh has mastered all 100 Cambridge Stage 2 Spells!");
        speakText("Congratulations Minh! You are now a Grand Cambridge Word Wizard!");
        confetti({ particleCount: 150, spread: 100 });
      }
    }

    function speakCurrentTarget() {
      const q = QUESTIONS[currentQIndex];
      if (q.target) speakText(q.target);
      else if (q.prompt) speakText(q.prompt);
    }

    // --- 6. MODAL & REALM NAVIGATION ---

      const m = document.getElementById("realmMapModal");
      m.classList.toggle("hidden");
      if (!m.classList.contains("hidden")) {
        const list = document.getElementById("realmListGrid");
        list.innerHTML = REALMS.map(r => `
          <div onclick="jumpToRealm(${r.range[0]})" class="p-2.5 bg-slate-800/80 hover:bg-purple-900/50 rounded-xl border border-slate-700 cursor-pointer flex items-center justify-between transition">

              <span class="text-xl">${r.icon}</span>
              <div>
                <h4 class="text-xs font-bold text-amber-300">Part ${r.id}: ${r.name}</h4>
                <p class="text-[10px] text-slate-400">Questions ${r.range[0]} - ${r.range[1]}</p>
              </div>
            </div>
            <span class="text-xs font-bold text-purple-400">Go ➔</span>
          </div>
        `).join('');
      }
    }

    function jumpToRealm(qId) {
      currentQIndex = qId - 1;
      saveProgress();
      toggleRealmMap();
      renderCurrentQuestion();
    }

    function toggleInventoryModal() {
      const m = document.getElementById("inventoryModal");
      m.classList.toggle("hidden");
      if (!m.classList.contains("hidden")) {
        const grid = document.getElementById("artifactsGrid");
        grid.innerHTML = REALMS.map(r => {
          const isUnlocked = currentQIndex >= r.range[0] - 1;
          return `
            <div class="flex flex-col items-center justify-center p-2 rounded-xl border ${isUnlocked ? 'bg-purple-950/60 border-amber-500/40 text-amber-300' : 'bg-slate-950/60 border-slate-800 text-slate-600 opacity-50'} text-center">

              <span class="text-[10px] font-bold truncate w-full">${r.name}</span>
            </div>
          `;
        }).join('');
      }
    }

    // KHỞI ĐỘNG GAME
    window.addEventListener("DOMContentLoaded", () => {
      loadProgress();
      renderCurrentQuestion();
    });
  </script>
</body>
</html>
