<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Muncher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --ink:#2A2340; --ink-2:#4B4766; --muted:#7D7A93; --line:#2A2340;
  --paper:#FFFDF6; --cream:#FFF4D6; --sun:#FFD166; --orange:#F27B00; --orange-d:#B85A00;
  --sky:#7CC7F2; --sky-d:#3E8FC7; --green:#4CB050; --green-d:#2E7D32; --red:#E5483B; --red-soft:#FFE1DC; --ok-soft:#DDF5E6;
  --page:#BFE3A6; --page-2:#E8F6DA;
  --display:"Fredoka","Lexend",system-ui,sans-serif; --word:"Lexend","Be Vietnam Pro",system-ui,sans-serif; --body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;padding:0 16px 32px;
  background:radial-gradient(120% 80% at 50% 0%,var(--page-2),var(--page));transition:background .6s}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.2px;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.btn{border:2.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:15px;box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--sun)}
.btn.go{background:linear-gradient(#7BD36B,#43A93B);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.teal{background:var(--sky)}
.btn.big{font-size:24px;padding:12px 40px;border-radius:20px;box-shadow:0 6px 0 var(--line)}
.btn.big:active{box-shadow:0 2px 0 var(--line);transform:translateY(4px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--paper);border:2.5px solid var(--line);border-radius:22px;box-shadow:0 5px 0 rgba(42,35,64,.9);padding:16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.note{font-size:12.5px;color:var(--ink-2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--sun)}
.switch{display:flex;align-items:center;gap:10px;font-size:13px}
.switch input{width:18px;height:18px;accent-color:var(--green)}

/* ---------- menu ---------- */
.menu{display:grid;gap:16px;padding-top:14px}
.title-card{position:relative;text-align:center;padding:18px 16px 14px;overflow:hidden;
  background:linear-gradient(#BDE7FF,#E9F7FF 60%,#D9F2C8);}
.title-card .mascot{width:min(300px,72%);display:block;margin:4px auto -4px;filter:drop-shadow(0 6px 0 rgba(42,35,64,.12));animation:bob 2.4s ease-in-out infinite}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(38px,10vw,56px);line-height:.95;color:var(--sun);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:1px}
.logo span{color:#FF9E3D}
.tag{font-family:var(--display);font-weight:600;font-size:16px;margin-top:8px;color:var(--ink-2)}
.cloud{position:absolute;top:12px;width:70px;height:24px;background:#fff;border-radius:20px;opacity:.9}
.cloud::before{content:"";position:absolute;left:14px;top:-12px;width:34px;height:30px;background:#fff;border-radius:50%}
.cloud.a{left:-10px;animation:drift 22s linear infinite}.cloud.b{right:-20px;top:40px;animation:drift 30s linear infinite reverse}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.worlds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.wcard{position:relative;border:2.5px solid var(--line);border-radius:16px;padding:0;overflow:hidden;aspect-ratio:3/4;background:#ccc center 30%/cover no-repeat;box-shadow:0 4px 0 var(--line)}
.wcard .wl{position:absolute;left:0;right:0;bottom:0;background:rgba(255,253,246,.94);border-top:2px solid var(--line);padding:3px 2px 4px;display:grid;line-height:1.1}
.wcard b{font-family:var(--display);font-size:13px}.wcard small{font-size:10px;color:var(--muted)}
.wcard.on{outline:4px solid var(--orange);outline-offset:2px}
.wcard:disabled{filter:grayscale(.85) brightness(.85);box-shadow:none;cursor:default}
.wcard .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.playrow{display:grid;justify-items:center;gap:10px}
.playrow .note{background:rgba(255,253,246,.85);border-radius:99px;padding:2px 12px}
details.card summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:15px}
.list{display:grid;gap:6px}
.li{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13.5px;background:#fff}
.li .e{font-size:22px;width:28px;text-align:center}
.li.bad{background:var(--red-soft)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.tile b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.tile span{font-size:11.5px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}

/* ---------- game ---------- */
body.playing{padding-bottom:6px;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
body.playing .wrap{max-width:1180px}
.game{display:grid;gap:8px;padding-top:8px;justify-items:center}
.game .side{display:grid;gap:8px;width:100%;max-width:640px}
.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
.bubble{position:relative;display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:6px 12px 6px 6px;box-shadow:0 4px 0 var(--line);min-height:62px}
.bubble .ava{width:50px;height:50px;flex:none;border-radius:14px;background:var(--cream);border:2px solid var(--line);display:grid;place-items:center;overflow:hidden}
.bubble .ava img{width:46px;height:46px;object-fit:contain}
.bubble .pic{font-size:36px;line-height:1}
.bubble .lbl{font-family:var(--display);font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.bubble .say{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2}
.bubble .glue{font-family:var(--word);font-weight:600;font-size:17px;line-height:1.35}
.bubble .glue i{font-style:normal;display:inline-block;min-width:54px;border-bottom:3px dashed var(--orange);text-align:center;color:var(--orange)}
.bubble .grow{flex:1;min-width:0}
.pattern{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.pattern i{font-style:normal;font-family:var(--word);font-weight:700;font-size:19px;min-width:26px;height:32px;padding:0 4px;border-radius:8px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;line-height:1}
.pattern i.blank{border-style:dashed;background:var(--cream);color:var(--orange)}
.pattern i.got{background:#C9F2D8}
.spk{flex:none;width:46px;height:46px;border-radius:14px;border:2.5px solid var(--line);background:var(--sky);font-size:20px;box-shadow:0 3px 0 var(--line);display:grid;place-items:center}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.stats{display:grid;gap:4px;align-content:center;justify-items:end;background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:6px 12px;box-shadow:0 4px 0 var(--line)}
.hearts{font-size:15px;letter-spacing:1px;white-space:nowrap}
.score{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.score small{font-size:12px;color:var(--muted);font-weight:600}
.lvbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--display);font-weight:600;font-size:14px}
.lvtrack{height:14px;border-radius:99px;background:#fff;border:2.5px solid var(--line);overflow:hidden}
.lvtrack i{display:block;height:100%;background:linear-gradient(90deg,#7BD36B,#FFD166);transition:width .35s;border-right:2px solid var(--line)}
.lvtrack i[style*="width: 0%"]{border-right:0}
.stage{position:relative}
.boardwrap{position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);touch-action:none;background:#9fd27d}
#cv{display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(42,35,64,.28);padding:16px;z-index:3}
.ovcard{background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:16px 22px;max-width:340px;display:grid;justify-items:center;gap:4px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.ovcard b{font-family:var(--display);font-size:26px;line-height:1.15}
.ovcard img{width:150px;height:auto}
.ovcard img.spin{animation:spin 1.4s cubic-bezier(.3,.9,.4,1) both}
.ovcard .tap{font-family:var(--display);font-weight:600;color:var(--orange);font-size:15px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{0%{transform:rotate(-200deg) scale(.3)}70%{transform:rotate(10deg) scale(1.1)}100%{transform:rotate(0) scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 14px;border-radius:12px;font-family:var(--display);font-size:16px;font-weight:600;white-space:nowrap;pointer-events:none;z-index:4;border:2.5px solid var(--line);animation:pop .25s ease-out}
.toast.good{background:#3FAE5A}.toast.bad{background:var(--red)}
.ctrl{display:grid;gap:8px;justify-items:center}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:7px;justify-content:center}
.pad button{border:2.5px solid var(--line);background:#fff;border-radius:16px;font-size:22px;box-shadow:0 4px 0 var(--line);color:var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);background:var(--sun)}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.game.land{grid-template-columns:auto minmax(240px,300px);align-items:start;justify-content:center;column-gap:16px}
.game.land .side{order:2}.game.land .stage{order:1}
.game.land .hud{grid-template-columns:1fr}
.game.land .stats{grid-template-columns:auto auto;justify-content:space-between;justify-items:start;align-items:center}
.game.land .pad{grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,62px)}
@media (min-width:700px){.game:not(.land) .pad{grid-template-columns:repeat(3,84px);grid-template-rows:repeat(2,60px)}}
.result{display:grid;gap:14px;padding-top:14px}
.result .hero{width:200px;margin:0 auto;display:block}
.stars{font-size:44px;text-align:center;letter-spacing:6px;line-height:1}
.stars .off{filter:grayscale(1);opacity:.35}
.mapcard{display:grid;justify-items:center;gap:6px;padding:14px 12px 12px;background:linear-gradient(#CFEBFF,#FFF3DC)}
.logoimg{width:min(420px,92%);height:auto;display:block;filter:drop-shadow(0 4px 0 rgba(42,35,64,.15))}
.mapcard .tag{margin-top:0}
.map{position:relative;width:min(480px,100%);aspect-ratio:2/3;background:center/cover no-repeat;border:2.5px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.isl{position:absolute;transform:translate(-50%,-50%);width:27%;min-height:12%;border-radius:50%;border:2.5px dashed rgba(42,35,64,.35);background:rgba(255,253,246,.55);display:grid;place-content:center;line-height:1.15;padding:2px;transition:transform .15s}
.isl b{font-family:var(--display);font-size:clamp(12px,3.2vw,17px)}.isl small{font-size:clamp(9px,2.2vw,11px);color:var(--ink-2)}
.isl.on{border:3px solid var(--orange);background:rgba(255,236,190,.92);box-shadow:0 0 0 5px rgba(242,123,0,.25);transform:translate(-50%,-50%) scale(1.06)}
.isl:disabled{background:rgba(220,220,230,.6);filter:grayscale(.6);cursor:default}
.mapmascot{position:absolute;width:24%;pointer-events:none;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(42,35,64,.15))}
.bubble .ava.picbox{width:68px;height:68px}.bubble .ava.picbox .pic{font-size:48px}.picbox .pimg{width:64px;height:64px}
.pimg{width:44px;height:44px;object-fit:contain;display:block}.pimg.sm{width:24px;height:24px;display:inline-block;vertical-align:middle}
.hearts{display:flex;gap:2px}.hearts img{width:20px;height:20px;object-fit:contain}.hearts img.lost{opacity:.45;filter:grayscale(.6)}
.score{display:flex;align-items:center;gap:4px}.score img{width:24px;height:24px}
.spk{background:transparent!important;border:0!important;box-shadow:none!important;padding:0}.spk img{width:46px;height:46px}
.bi{width:22px;height:22px;vertical-align:-5px;margin-right:6px}.btn.big .bi{width:34px;height:34px;vertical-align:-8px}
.stars{display:flex;justify-content:center;align-items:center;gap:6px}.stars img{width:56px;height:56px}
.testbar{display:grid;gap:8px;justify-items:center;text-align:center;background:#FFF1C9;border:2.5px dashed var(--orange);border-radius:16px;padding:10px 12px;width:min(520px,100%);font-size:13px}
.lvpick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.lvpick button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 9px;font-weight:700;font-size:13px}.lvpick button[aria-pressed="true"]{background:var(--sun)}
.modechip{font-family:var(--display);font-weight:700;font-size:18px;padding:4px 14px;border-radius:99px;border:2.5px solid var(--line);margin:4px 0}
.m-pic{background:#FFF1C2}.m-listen{background:#D9ECFF}.m-missing{background:#D8F5DF}.m-spell{background:#EBDDFF}.m-glue{background:#FFE2C7}
.bubble.m-pic,.bubble.m-listen,.bubble.m-missing,.bubble.m-spell,.bubble.m-glue{transition:background .3s}
.wwbar{display:grid;justify-items:center;gap:4px}.wwbar a{text-decoration:none}a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
.loader{font-family:var(--display);font-weight:600;color:var(--ink-2)}
@media (max-width:520px){.bubble .ava.picbox{width:56px;height:56px}.picbox .pimg{width:52px;height:52px}.hearts img{width:14px;height:14px}.score img{width:18px;height:18px}.spk img{width:40px;height:40px}.bubble{min-height:54px;padding:5px 8px 5px 5px;gap:7px}.bubble .ava{width:42px;height:42px}.bubble .ava img{width:38px;height:38px}.bubble .pic{font-size:30px}.bubble .say,.bubble .glue{font-size:15px}.pattern i{font-size:16px;min-width:22px;height:28px}.spk{width:40px;height:40px;font-size:17px}.stats{padding:5px 8px}.hearts{font-size:11px;letter-spacing:0}.score{font-size:18px}.game:not(.land) .pad{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,40px);gap:5px}.ctrl .btn{padding:5px 12px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.mapmascot,.ovcard,.ovcard img.spin,.toast{animation:none}}
</style>
</head>
<body>
<div class="wrap"><main id="app"></main></div>
<script>
/* =====================================================================
   Word Muncher 2.5D · word bank
   ESL weeks 2–7, Science Unit 4, phonics, Movers topics, Jolly tricky words
   + Week 11 (ESL birds & can/can't, joining words, qu, tricky, EFL oy/ear/time words, Science 2.3)
   format: "word:emoji" separated by spaces, "_" = space inside a phrase
   ===================================================================== */
const BANK=[
 ["cvc","Phonics: short vowels","cat:🐱 dog:🐶 pig:🐷 bed:🛏️ sun:☀️ hat:🎩 cup:☕ ten:🔟 fox:🦊 bug:🐛 net:🥅 bus:🚌 map:🗺️ hen:🐔 bat:🦇 box:📦 jam:🍯 fan:🪭 web:🕸️ van:🚐"],
 ["magice","Phonics: magic e","cake:🎂 bike:🚲 kite:🪁 bone:🦴 cube:🧊 five:5️⃣ nose:👃 rose:🌹 nine:9️⃣ cone:🍦 lake:🏞️ tube:🧪 smile:😊 plane:✈️ snake:🐍 whale:🐋 grapes:🍇 slide:🛝"],
 ["school","School things (ESL W2)","pencil:✏️ book:📕 ruler:📏 scissors:✂️ backpack:🎒 clock:🕒 calendar:📅 crayon:🖍️ notebook:📓 pen:🖊️ paint:🎨 letter:✉️ computer:💻 desk:🗄️"],
 ["mine","My things & clothes (ESL W4)","key:🔑 phone:📱 jumper:🧥 cap:🧢 shoe:👟 sock:🧦 dress:👗 shirt:👕 jeans:👖 scarf:🧣 glove:🧤 boot:👢 glasses:👓 bag:👜 umbrella:☂️ ring:💍 crown:👑 skipping_rope:🪢"],
 ["jobs","Jobs (ESL W6)","nurse:🧑‍⚕️ firefighter:🧑‍🚒 police_officer:👮 doctor:🩺 teacher:🧑‍🏫 bus_driver:🚍 waiter:🍽️ reporter:📰 window_cleaner:🧽 farmer:🧑‍🌾 cook:🧑‍🍳 pilot:🧑‍✈️ singer:🎤 dancer:💃 artist:🧑‍🎨"],
 ["places","Places (ESL W7)","hospital:🏥 school:🏫 fire_station:🚒 police_station:🚓 shop:🏪 restaurant:🍝 park:🛝 house:🏠 bus_stop:🚏 library:📚 castle:🏰 tent:⛺ bank:🏦 hotel:🏨 supermarket:🛒 airport:🛫 beach:🏖️ island:🏝️ mountain:⛰️ zoo:🦒"],
 ["animals","Animals (Science 4.1)","bird:🐦 fish:🐟 duck:🦆 zebra:🦓 horse:🐴 feathers:🪶 bear:🐻 bee:🐝 cow:🐄 frog:🐸 goat:🐐 lion:🦁 monkey:🐒 mouse:🐭 owl:🦉 panda:🐼 rabbit:🐰 sheep:🐑 shark:🦈 snail:🐌 spider:🕷️ tiger:🐯 dolphin:🐬 penguin:🐧 kangaroo:🦘 giraffe:🦒 elephant:🐘 crocodile:🐊 parrot:🦜 octopus:🐙 butterfly:🦋 ant:🐜 camel:🐫 turtle:🐢 crab:🦀 lizard:🦎 chicken:🐓"],
 ["babies","Growing up (Science 4.2)","kitten:🐈 puppy:🐕 chick:🐤 baby:👶 child:🧒 adult:🧑 grandpa:👴 grandma:👵"],
 ["food","Healthy food (Science 4.4)","apple:🍎 banana:🍌 carrot:🥕 rice:🍚 bread:🍞 milk:🥛 egg:🥚 cheese:🧀 water:💧 candy:🍬 pear:🍐 orange:🍊 lemon:🍋 cherry:🍒 peach:🍑 mango:🥭 pineapple:🍍 coconut:🥥 tomato:🍅 potato:🥔 corn:🌽 onion:🧅 pizza:🍕 cookie:🍪 burger:🍔 sandwich:🥪 soup:🍲 salad:🥗 juice:🧃 tea:🍵 honey:🍯 ice_cream:🍨 chocolate:🍫 pie:🥧 hot_dog:🌭 noodles:🍜 pancake:🥞 popcorn:🍿 lollipop:🍭 watermelon:🍉"],
 ["body","Body & teeth (Science 4.5)","tooth:🦷 toothbrush:🪥 soap:🧼 hand:✋ heart:❤️ germs:🦠 eye:👁️ ear:👂 mouth:👄 foot:🦶 leg:🦵 arm:💪 tongue:👅"],
 ["home","At home (Movers)","chair:🪑 door:🚪 sofa:🛋️ bath:🛁 mirror:🪞 spoon:🥄 ball:🏐 football:⚽ teddy_bear:🧸 drum:🥁 guitar:🎸 piano:🎹 robot:🤖 balloon:🎈 present:🎁 candle:🕯️ broom:🧹 bucket:🪣 basket:🧺 camera:📷 television:📺 radio:📻 lamp:🪔 window:🪟"],
 ["nature","Weather & nature (Movers)","star:⭐ moon:🌙 cloud:☁️ rain:🌧️ snow:❄️ rainbow:🌈 wind:🌬️ tree:🌳 flower:🌸 leaf:🍃 mushroom:🍄 cactus:🌵 rock:🪨 fire:🔥 sea:🌊 volcano:🌋 sunflower:🌻"],

  else if(m==="glue") main=`${ava}<div class="grow"><div class="lbl">${lbl} · and / or / but${G.foods.some(f=>f.w==="because")?" / because":""}</div><div class="glue">${esc(t.glue).replace("___","<i>?</i>")}</div></div>${spk}`;
  else main=`${t.pic?`<span class="ava picbox" style="background:#fff"><span class="pic">${picHtml(t.pic)}</span></span>`:ava}<div class="grow"><div class="lbl">${lbl}</div><div class="pattern">${[...t.letters].map((c,i)=>i<G.spellIdx?`<i class="got">${c}</i>`:`<i class="blank">_</i>`).join("")}</div></div>${spk}`;
  el.innerHTML=main; el.className="bubble m-"+m; const rp=$("#replay"); if(rp) rp.onclick=()=>say(promptSpeech(t,m));
  $("#hearts").innerHTML=Array.from({length:LIVES},(_,i)=>`<img src="img/${i<G.lives?"ui_0":"ui_1"}.webp" class="${i<G.lives?"":"lost"}" alt="">`).join("");
  $("#score").innerHTML=`<img src="img/ui_2.webp" alt="">${G.score}`; $("#len").textContent=`🐛 ${G.snake.length}/${BFLY_LEN}${G.bflies?" · 🦋"+G.bflies:""}`;
  const W=WORLDS[curWorld()];
  $("#lvname").textContent=`${W.emoji} Level ${G.level}${G.boss?" · BOSS":""}${G.test?" · 🔧":""}`; $("#lvfill").style.width=(G.boss?G.boss.got/BOSS_NEED*100:G.inLevel/PER_LEVEL*100)+"%";
}
function showOverlay(t,sub,o){ o=o||{}; const el=$("#ov"); if(el) el.innerHTML=`<div class="overlay"><div class="ovcard">${o.img?`<img src="${o.img}" alt="" class="${o.spin?"spin":""}" style="${o.small?"width:110px":""}">`:""}<b>${esc(t)}</b>${o.mode&&G?`<div class="modechip m-${modeOf()}">${MODE_INFO[modeOf()].icon} ${MODE_INFO[modeOf()].txt}</div>`:""}<div class="note">${esc(sub.replace(/(^| · )tap.*$/i,""))}</div><div class="tap">${/tap|press/i.test(sub)?"Tap to go!":""}</div></div></div>`; }
function hideOverlay(){ const o=$("#ov"); if(o) o.innerHTML=""; }
function toast(m,k){ const t=$("#tt"); if(!t)return; t.innerHTML=`<div class="toast ${k||""}">${esc(m)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>{t.innerHTML=""},1400); }
function resultHtml(){
  const g=G; const learned=[...new Map(g.eaten.map(x=>[x.glue?x.glue:x.w,x])).values()]; const wi=LEVELS[g.level].world, W=WORLDS[wi];
  const stars=g.won?3:(g.eaten.length>=12&&g.wrong.length<=3)?3:g.eaten.length>=6?2:g.eaten.length>=1?1:0;
  const nw=g.newWorlds.map(i=>`${WORLDS[i].emoji} ${WORLDS[i].name}`);
  return `<div class="result"><section class="card" style="display:grid;gap:12px">
    <img class="hero" src="${heroImg(wi,5)}" alt="">
    <div class="stars">${[0,1,2].map(i=>`<img src="img/${i<stars?"ui_2":"ui_3"}.webp" alt="">`).join("")}${g.won||g.newBest?`<img src="img/ui_9.webp" alt="" style="margin-left:6px">`:""}</div>
    <div style="text-align:center"><div class="eyebrow">${g.won?"All worlds cleared":"Game over"}</div><h2 style="font-size:24px">${g.won?"You beat every boss! 🏆":g.newBest?"New record! 🎉":g.score>=150?"Great job!":"Nice try! Keep going!"}</h2></div>
    <div class="tiles"><div class="tile"><b>${g.score}</b><span>points · best ${best.score}</span></div><div class="tile"><b>${g.level}</b><span>level · ${W.emoji} ${W.name}</span></div><div class="tile"><b>${g.eaten.length}</b><span>right answers</span></div><div class="tile"><b>${g.bflies||0} 🦋</b><span>butterflies</span></div></div>
    ${nw.length?`<div class="li" style="background:var(--ok-soft)">🔓 Unlocked: <b>${nw.join(" · ")}</b> + new outfit</div>`:""}
    ${g.wrong.length?`<div><div class="eyebrow" style="margin-bottom:6px">Words to practise</div><div class="list">${[...new Map(g.wrong.map(w=>[w.target.glue||w.target.w,w])).values()].map(w=>{const full=fullSpeech(w.target);return `<div class="li bad"><span class="e">${w.target.pic?picHtml(w.target.pic,"sm"):"🔊"}</span><span><b>${esc(full)}</b> · ate “${esc(w.got)}”</span><button class="btn" style="margin-left:auto;padding:4px 10px" data-say="${esc(full)}">🔊</button></div>`}).join("")}</div></div>`:""}
    ${learned.length?`<div><div class="eyebrow" style="margin-bottom:6px">You got these right</div><div class="chips">${learned.map(x=>`<button class="chip" data-say="${esc(fullSpeech(x))}">${x.pic?picHtml(x.pic,"sm")+" ":""}${esc(x.glue?x.glue.replace("___",x.w):x.w)}${!x.glue&&mastered(x.w)?" ⭐":""}</button>`).join("")}</div></div>`:""}
    <div class="note">${g.test?"🔧 Test game, not saved.":!g.startedAt?"Game not started, so not saved.":g.savedServer?"✓ Saved to server.":db?"Saving…":"Saved on this device."}</div>
    ${WW&&!g.test?`<div class="li" style="background:#E8F3FF">💎 <span><b>+${g.gems||0} Magic Gems</b> for Word Wizard · today ${gemsToday()}/${GEM_CAP}${g.gemCapped?" · daily limit reached":""}</span></div>`:""}
    <div class="row" style="justify-content:center"><button class="btn go big" id="again">Play again</button><button class="btn" id="menu">Home</button>${WW?`<a class="btn" href="../">🪄 Word Wizard</a>`:""}</div>
  </section></div>`;
}
function saveCfg(){ LS.set("snake.cfg",cfg); }
function bind(){
  document.querySelectorAll("[data-speed]").forEach(b=>b.onclick=()=>{cfg.speed=b.dataset.speed;saveCfg();render()});
  document.querySelectorAll("[data-world]").forEach(b=>b.onclick=()=>{ if(TEST){ testLevel=+b.dataset.world*2+1; render(); return; } cfg.world=+b.dataset.world;saveCfg();render()});
  const st=$("#start"); if(st) st.onclick=()=>{ unlockAudio(); const w=TEST?LEVELS[testLevel].world:Math.min(cfg.world||0,prog.unlocked); st.textContent="Loading…"; preload(worldAssets(w)).then(()=>newGame(w,TEST?testLevel:0)); };
  const go=$("#gateok"); if(go) go.onclick=()=>{ const v=($("#gate").value||"").trim(); if(v==="56"){ TEST=true; testLevel=Math.min(cfg.world||0,prog.unlocked)*2+1; render(); window.scrollTo(0,0); } else { $("#gate").value=""; $("#gate").placeholder="?"; } };
  const to=$("#testoff"); if(to) to.onclick=()=>{ TEST=false; render(); };
  document.querySelectorAll("[data-tlv]").forEach(b=>b.onclick=()=>{ testLevel=+b.dataset.tlv; render(); });
  const sn=$("#sndtest"); if(sn) sn.onclick=()=>{ unlockAudio(); sfx.good(); sayAfterSfx("Hello Minh! Let's play."); };
  const vs=$("#voicesel"); if(vs) vs.onchange=()=>{ cfg.voice=vs.value; saveCfg(); unlockAudio(); say("Hello Minh! A parrot can talk and fly."); };
  const vt=$("#voicetest"); if(vt) vt.onclick=()=>{ unlockAudio(); say("Hello Minh! A parrot can talk and fly."); };
  const so=$("#sfxon"); if(so) so.onchange=()=>{ cfg.sfx=so.checked; saveCfg(); };
  document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.dir.split(",").map(Number);turn(x,y)});
  const ps=$("#pause"); if(ps) ps.onclick=pause;
  const q=$("#quit"); if(q) q.onclick=()=>{ if(G){clearInterval(G.timer);G.over=true; saveBest(); saveGame();} screen="result"; render(); };
  const ag=$("#again"); if(ag) ag.onclick=()=>newGame(LEVELS[G.level].world);
  const mn=$("#menu"); if(mn) mn.onclick=()=>{screen="menu";G=null;render()};
  document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  const bw=$("#bw"); if(bw){
    let sx=0,sy=0;
    bw.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
    bw.addEventListener("touchmove",e=>{e.preventDefault();},{passive:false});
    bw.addEventListener("touchend",e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
      if(Math.max(Math.abs(dx),Math.abs(dy))<18){ if(G&&(G.ready||G.paused)) start(); return; }
      if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1);});
    bw.addEventListener("click",()=>{ if(G&&(G.ready||G.paused)) start(); });
  }
}
document.addEventListener("keydown",e=>{
  if(screen!=="game"||!G)return; const k=e.key.toLowerCase();
  const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if(m[k]){e.preventDefault();turn(...m[k]);} else if(k===" "){e.preventDefault(); if(G.ready) start(); else pause();} else if(G.ready) start();
});
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&G&&!G.paused&&!G.ready&&!G.over) pause(); });
function relayout(){ if(screen!=="game")return; const g=$("#game"); if(g&&g.classList.contains("land")!==isLand()){ const wasRun=G&&!G.ready&&!G.paused&&!G.over; if(wasRun){G.paused=true;clearInterval(G.timer);}
  const ovHtml=$("#ov")?$("#ov").innerHTML:""; $("#app").innerHTML=gameHtml(); bind(); R.cv=$("#cv"); R.ctx=R.cv.getContext("2d"); setupCanvas(); updateHud();
  if(wasRun) showOverlay("Paused","Tap to keep playing"); else if(ovHtml) $("#ov").innerHTML=ovHtml; } else setupCanvas(); }
let _rt; function onResize(){ clearTimeout(_rt); _rt=setTimeout(relayout,120); }
window.addEventListener("resize",onResize); window.addEventListener("orientationchange",onResize); if(window.visualViewport) window.visualViewport.addEventListener("resize",onResize);
render(); initDb();
/* warm the image cache: current world first, then the rest */
preload(worldAssets(Math.min(cfg.world||0,prog.unlocked)).concat(["hero_change"],UI_ASSETS)).then(()=>{ for(let i=0;i<WORLDS.length;i++) preload(worldAssets(i)); });
</script>
</body>
